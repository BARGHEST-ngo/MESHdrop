<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <link rel="stylesheet" href="/style.css"/>
    <title>MESHdrop</title>
    <style>
        /* Placeholder layout for the first working version; the real design comes later. */
        .screen[hidden] { display: none; }
        .screen { display: flex; flex-direction: column; gap: 14px; align-items: flex-start; width: 100%; max-width: 560px; }
        .field-label { font-size: 13px; opacity: 0.7; }
        .address {
            width: 100%; font-family: monospace; font-size: 12px;
            word-break: break-all; padding: 10px; border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
        }
        textarea.address { color: inherit; border: 1px solid rgba(255, 255, 255, 0.12); resize: none; height: 5.5em; }
        .pin { font-size: 44px; letter-spacing: 0.25em; font-variant-numeric: tabular-nums; }
        input.pin {
            width: 7.5em; font-size: 28px; padding: 6px 10px; border-radius: 10px; color: inherit;
            background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .row { display: flex; gap: 10px; }
        .btn-quiet { background: rgba(255, 255, 255, 0.08); box-shadow: none; }
        .btn:disabled { opacity: 0.5; cursor: default; }
        .error { color: #ff6b6b; min-height: 1.2em; }
        .error.is-info { color: var(--muted); }
        .file { font-size: 18px; }
        .file-size { opacity: 0.6; }
    </style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<main class="container">
    <h1 class="title"><span class="title-accent">MESH</span>drop</h1>

    <!-- Home: choose a direction -->
    <section class="screen" id="screen-home">
        <p class="subtitle">Private file transfer. No cloud, no account, no trace.</p>
        <div class="row">
            <button class="btn" id="send">Send</button>
            <button class="btn" id="receive">Receive</button>
        </div>
    </section>

    <!-- Send: server running, pairing open -->
    <section class="screen" id="screen-send-waiting" hidden>
        <div class="file" id="send-file"></div>
        <span class="field-label">Send this link to the receiver</span>
        <div class="address" id="address"></div>
        <span class="field-label">Then give them this PIN separately</span>
        <div class="pin" id="pin"></div>
        <div class="row">
            <button class="btn" id="copy">Copy link</button>
            <button class="btn btn-quiet" id="send-cancel">Cancel</button>
        </div>
    </section>

    <!-- Send: receiver paired -->
    <section class="screen" id="screen-send-connected" hidden>
        <p class="subtitle">Connected to <strong id="peer-name"></strong></p>
        <span class="field-label" id="send-status"></span>
        <button class="btn btn-quiet" id="send-disconnect">Disconnect</button>
    </section>

    <!-- Receive: enter link and PIN -->
    <form class="screen" id="screen-receive-form" hidden>
        <label class="field-label" for="receive-address">Paste the link from the sender</label>
        <textarea class="address" id="receive-address" spellcheck="false" autocomplete="off"></textarea>
        <label class="field-label" for="receive-pin">PIN</label>
        <input class="pin" id="receive-pin" inputmode="numeric" maxlength="6" autocomplete="off"/>
        <div class="row">
            <button class="btn" id="receive-connect" type="submit" disabled>Connect</button>
            <button class="btn btn-quiet" id="receive-back" type="button">Back</button>
        </div>
    </form>

    <!-- Receive: Connect in progress -->
    <section class="screen" id="screen-receive-connecting" hidden>
        <p class="subtitle">Connecting…</p>
        <button class="btn btn-quiet" id="receive-cancel">Cancel</button>
    </section>

    <!-- Receive: paired with sender -->
    <section class="screen" id="screen-receive-connected" hidden>
        <p class="subtitle">Connected to the sender</p>
        <span class="field-label" id="receive-status"></span>
        <button class="btn btn-quiet" id="receive-disconnect">Disconnect</button>
    </section>

    <!-- Receive: sender has offered a file -->
    <section class="screen" id="screen-receive-offer" hidden>
        <span class="field-label">The sender wants to send you</span>
        <div class="file" id="offer-file"></div>
        <div class="row">
            <button class="btn" id="offer-accept">Accept</button>
            <button class="btn btn-quiet" id="offer-decline">Decline</button>
        </div>
    </section>

    <p class="error" id="error" role="status" aria-live="polite"></p>
</main>

<script type="module" src="/src/main.js"></script>
</body>
</html>
