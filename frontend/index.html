<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <link rel="stylesheet" href="/style.css"/>
    <title>meshdrop</title>
    <style>
        /* Placeholder layout for the first working version; the real design comes later. */
        .state[hidden] { display: none; }
        .state { display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
        .field-label { font-size: 13px; opacity: 0.7; }
        .address {
            width: 100%; max-width: 560px; font-family: monospace; font-size: 12px;
            word-break: break-all; padding: 10px; border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
        }
        .pin { font-size: 44px; letter-spacing: 0.25em; font-variant-numeric: tabular-nums; }
        .row { display: flex; gap: 10px; }
        .btn-quiet { background: rgba(255, 255, 255, 0.08); box-shadow: none; }
        .error { color: #ff6b6b; min-height: 1.2em; }
    </style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<main class="container">
    <h1 class="title"><span class="title-accent">mesh</span>drop</h1>

    <!-- Idle: nothing running -->
    <section class="state" id="state-idle">
        <p class="subtitle">Send files straight to another computer.</p>
        <button class="btn" id="send">Send</button>
    </section>

    <!-- Waiting: server running, pairing open -->
    <section class="state" id="state-waiting" hidden>
        <span class="field-label">Send this link to the receiver</span>
        <div class="address" id="address"></div>
        <span class="field-label">Then give them this PIN separately</span>
        <div class="pin" id="pin"></div>
        <div class="row">
            <button class="btn" id="copy">Copy link</button>
            <button class="btn btn-quiet" id="cancel-waiting">Cancel</button>
        </div>
    </section>

    <!-- Connected: receiver paired -->
    <section class="state" id="state-connected" hidden>
        <p class="subtitle">Connected to <strong id="peer-name"></strong></p>
        <button class="btn btn-quiet" id="cancel-connected">Disconnect</button>
    </section>

    <p class="error" id="error" role="status" aria-live="polite"></p>
</main>

<script type="module" src="/src/main.js"></script>
</body>
</html>
